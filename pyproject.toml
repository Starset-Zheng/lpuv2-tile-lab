[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpuv2-tile-lab"
version = "0.1.0"
description = "Qwen operator references, Tile programs and numerical validation"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["pymodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

